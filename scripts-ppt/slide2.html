<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f8f9fa;
  font-family: Arial, sans-serif;
  display: flex;
}
.content {
  width: 100%;
  padding: 40pt;
}
.header {
  background: #5D4E37;
  padding: 15pt 30pt;
  border-radius: 8pt;
  margin-bottom: 20pt;
}
.header h2 {
  margin: 0;
  color: #ffffff;
  font-size: 28pt;
}
.info-box {
  background: #ffffff;
  padding: 20pt;
  border-radius: 8pt;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.info-box h3 {
  margin: 0 0 15pt 0;
  color: #2C3E50;
  font-size: 18pt;
}
.grid {
  display: flex;
  gap: 20pt;
}
.grid-item {
  flex: 1;
  background: #f1f3f4;
  padding: 15pt;
  border-radius: 6pt;
  border-left: 4pt solid #5D4E37;
}
.grid-item p {
  margin: 5pt 0;
  font-size: 14pt;
  color: #34495E;
}
.grid-item strong {
  display: block;
  font-size: 12pt;
  color: #5D4E37;
  margin-bottom: 3pt;
}
</style>
</head>
<body>
<div class="content">
  <div class="header">
    <h2>基本信息</h2>
  </div>
  <div class="info-box">
    <h3>剧集概述</h3>
    <div class="grid">
      <div class="grid-item">
        <strong>类型</strong>
        <p>喜剧/成长/传承</p>
      </div>
      <div class="grid-item">
        <strong>风格</strong>
        <p>轻喜剧，温馨感人</p>
      </div>
      <div class="grid-item">
        <strong>总集数</strong>
        <p>10集</p>
      </div>
      <div class="grid-item">
        <strong>单集时长</strong>
        <p>5分钟</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
