<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f8f9fa;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.content {
  padding: 30pt;
  flex: 1;
  overflow-y: auto;
}
.header {
  background: linear-gradient(90deg, #5D4E37 0%, #8B5A2B 100%);
  padding: 12pt 25pt;
  border-radius: 8pt;
  margin-bottom: 15pt;
}
.header h2 {
  margin: 0;
  color: #ffffff;
  font-size: 24pt;
}
.section {
  background: #ffffff;
  border-radius: 8pt;
  padding: 15pt;
  margin-bottom: 12pt;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
.section h3 {
  margin: 0 0 10pt 0;
  color: #2C3E50;
  font-size: 15pt;
  border-bottom: 2pt solid #5D4E37;
  padding-bottom: 5pt;
}
.section ul {
  margin: 0;
  padding-left: 18pt;
}
.section li {
  margin: 5pt 0;
  font-size: 11pt;
  color: #546E7A;
}
</style>
</head>
<body>
<div class="content">
  <div class="header">
    <h2>第2集：学艺的日子</h2>
  </div>
  <div class="section">
    <h3>核心事件</h3>
    <ul>
      <li>赵厂长宣布债务免除</li>
      <li>刘师傅知情但不说话（悬念）</li>
      <li>学习杀青和揉捻</li>
      <li>王胖子笑话阿三</li>
    </ul>
  </div>
  <div class="section">
    <h3>主要冲突</h3>
    <ul>
      <li>学艺困难 vs 师父严厉</li>
      <li>刘师傅知道债务被免除但不解释</li>
      <li>母亲病情的疑惑</li>
    </ul>
  </div>
  <div class="section">
    <h3>名场面</h3>
    <ul>
      <li>刘师傅教杀青："温度240度，快速翻动"</li>
      <li>刘师傅教揉捻："力度适中"</li>
      <li>王胖子："阿三，你这是揉茶叶还是揉面团啊？"</li>
    </ul>
  </div>
</div>
</body>
</html>
