<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f8f9fa;
  font-family: Arial, sans-serif;
  display: flex;
}
.content {
  width: 100%;
  padding: 35pt;
}
.title {
  background: #5D4E37;
  padding: 12pt 25pt;
  border-radius: 8pt;
  margin-bottom: 20pt;
}
.title h2 {
  margin: 0;
  color: #ffffff;
  font-size: 26pt;
}
.two-column {
  display: flex;
  gap: 20pt;
}
.column {
  flex: 1;
  background: #ffffff;
  padding: 20pt;
  border-radius: 8pt;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}
.column h3 {
  margin: 0 0 15pt 0;
  color: #2C3E50;
  font-size: 18pt;
  border-bottom: 2pt solid #5D4E37;
  padding-bottom: 8pt;
}
.column ul {
  margin: 0;
  padding-left: 20pt;
}
.column li {
  margin: 8pt 0;
  font-size: 13pt;
  color: #34495E;
  line-height: 1.4;
}
</style>
</head>
<body>
<div class="content">
  <div class="title">
    <h2>核心主题</h2>
  </div>
  <div class="two-column">
    <div class="column">
      <h3>核心主题</h3>
      <ul>
        <li><b>传承：</b>传统六堡茶技艺的传承</li>
        <li><b>成长：</b>陈阿三从学徒到接班人的成长</li>
        <li><b>选择：</b>坚持传统 vs 追求现代化的选择</li>
      </ul>
    </div>
    <div class="column">
      <h3>风格特点</h3>
      <ul>
        <li><b>轻喜剧：</b>轻松幽默，让人会心一笑</li>
        <li><b>温馨感人：</b>有笑有泪，最后温馨收尾</li>
        <li><b>90年代语境：</b>符合时代背景</li>
      </ul>
    </div>
  </div>
</div>
</body>
</html>
