<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f8f9fa;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.content {
  padding: 30pt;
  flex: 1;
  overflow-y: auto;
}
.header {
  background: linear-gradient(90deg, #C0392B 0%, #E74C3C 100%);
  padding: 12pt 25pt;
  border-radius: 8pt;
  margin-bottom: 15pt;
}
.header h2 {
  margin: 0;
  color: #ffffff;
  font-size: 24pt;
}
.section {
  background: #ffffff;
  border-radius: 8pt;
  padding: 15pt;
  margin-bottom: 12pt;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
.section h3 {
  margin: 0 0 10pt 0;
  color: #C0392B;
  font-size: 15pt;
  border-bottom: 2pt solid #C0392B;
  padding-bottom: 5pt;
}
.section ul {
  margin: 0;
  padding-left: 18pt;
}
.section li {
  margin: 5pt 0;
  font-size: 11pt;
  color: #546E7A;
}
</style>
</head>
<body>
<div class="content">
  <div class="header">
    <h2>第5集：分歧的开始</h2>
  </div>
  <div class="section">
    <h3>核心事件</h3>
    <ul>
      <li>周经理提出现代化设备</li>
      <li>刘师傅坚决反对</li>
      <li>赵厂长左右为难</li>
      <li>阿三站在刘师傅一边</li>
    </ul>
  </div>
  <div class="section">
    <h3>主要冲突</h3>
    <ul>
      <li>传统工艺 vs 现代化设备</li>
      <li>成本 vs 技艺</li>
      <li>生存 vs 守护</li>
    </ul>
  </div>
  <div class="section">
    <h3>名场面</h3>
    <ul>
      <li>刘师傅："六堡茶之所以好，就是因为传统工艺。如果用现代化设备，那还是六堡茶吗？"</li>
      <li>刘师傅："如果引入现代化设备，那我就退休"</li>
      <li>阿三："因为刘师傅教的是传统工艺，我相信刘师傅"</li>
    </ul>
  </div>
</div>
</body>
</html>
