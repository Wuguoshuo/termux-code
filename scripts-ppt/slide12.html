<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f8f9fa;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.content {
  padding: 30pt;
  flex: 1;
  overflow-y: auto;
}
.header {
  background: linear-gradient(90deg, #C0392B 0%, #E74C3C 100%);
  padding: 12pt 25pt;
  border-radius: 8pt;
  margin-bottom: 15pt;
}
.header h2 {
  margin: 0;
  color: #ffffff;
  font-size: 24pt;
}
.section {
  background: #ffffff;
  border-radius: 8pt;
  padding: 15pt;
  margin-bottom: 12pt;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
.section h3 {
  margin: 0 0 10pt 0;
  color: #C0392B;
  font-size: 15pt;
  border-bottom: 2pt solid #C0392B;
  padding-bottom: 5pt;
}
.section ul {
  margin: 0;
  padding-left: 18pt;
}
.section li {
  margin: 5pt 0;
  font-size: 11pt;
  color: #546E7A;
}
</style>
</head>
<body>
<div class="content">
  <div class="header">
    <h2>第6集：风波来了</h2>
  </div>
  <div class="section">
    <h3>核心事件</h3>
    <ul>
      <li>茶厂要改制</li>
      <li>引入现代化设备</li>
      <li>王胖子准备跳槽</li>
      <li>刘师傅坚持反对，但最后退让</li>
    </ul>
  </div>
  <div class="section">
    <h3>主要冲突</h3>
    <ul>
      <li>去留选择：阿三该跳槽吗？</li>
      <li>友情考验：王胖子支持阿三</li>
      <li>刘师傅的退让："跳槽吧"</li>
    </ul>
  </div>
  <div class="section">
    <h3>名场面</h3>
    <ul>
      <li>刘师傅："厂里决定了，那我呢？如果我坚持传统工艺，那是不是要把我赶走？"</li>
      <li>刘师傅："跳槽吧。你跟着我，学不到什么。出去看看，也好"</li>
      <li>王胖子："你担心刘师傅？但刘师傅都退休了，你留着也没用"</li>
    </ul>
  </div>
</div>
</body>
</html>
