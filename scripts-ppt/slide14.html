<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f8f9fa;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.content {
  padding: 30pt;
  flex: 1;
  overflow-y: auto;
}
.header {
  background: linear-gradient(90deg, #8E44AD 0%, #A93226 100%);
  padding: 12pt 25pt;
  border-radius: 8pt;
  margin-bottom: 15pt;
}
.header h2 {
  margin: 0;
  color: #ffffff;
  font-size: 24pt;
}
.section {
  background: #ffffff;
  border-radius: 8pt;
  padding: 15pt;
  margin-bottom: 12pt;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
.section h3 {
  margin: 0 0 10pt 0;
  color: #8E44AD;
  font-size: 15pt;
  border-bottom: 2pt solid #8E44AD;
  padding-bottom: 5pt;
}
.section ul {
  margin: 0;
  padding-left: 18pt;
}
.section li {
  margin: 5pt 0;
  font-size: 11pt;
  color: #546E7A;
}
</style>
</head>
<body>
<div class="content">
  <div class="header">
    <h2>第8集：外面的世界</h2>
  </div>
  <div class="section">
    <h3>核心事件</h3>
    <ul>
      <li>广州茶叶市场的乱象</li>
      <li>发现假六堡茶</li>
      <li>阿三的火眼金睛识别假茶</li>
      <li>决定回茶厂</li>
    </ul>
  </div>
  <div class="section">
    <h3>主要冲突</h3>
    <ul>
      <li>假茶泛滥 vs 真技艺珍贵</li>
      <li>外面 vs 回归</li>
      <li>珍惜传统工艺</li>
    </ul>
  </div>
  <div class="section">
    <h3>名场面</h3>
    <ul>
      <li>阿三："六堡茶陈化一年，颜色应该是深褐色的，但这茶叶是黑色的"</li>
      <li>阿三："六堡茶陈化三年，香味应该是陈香味，但这茶叶是焦香味"</li>
      <li>阿三："你们广州的茶叶，很多都是假的"</li>
      <li>旁白："原来外面的世界，也不是那么好"</li>
    </ul>
  </div>
</div>
</body>
</html>
