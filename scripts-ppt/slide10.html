<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f8f9fa;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.content {
  padding: 30pt;
  flex: 1;
  overflow-y: auto;
}
.header {
  background: linear-gradient(90deg, #5D4E37 0%, #8B5A2B 100%);
  padding: 12pt 25pt;
  border-radius: 8pt;
  margin-bottom: 15pt;
}
.header h2 {
  margin: 0;
  color: #ffffff;
  font-size: 24pt;
}
.section {
  background: #ffffff;
  border-radius: 8pt;
  padding: 15pt;
  margin-bottom: 12pt;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
.section h3 {
  margin: 0 0 10pt 0;
  color: #2C3E50;
  font-size: 15pt;
  border-bottom: 2pt solid #5D4E37;
  padding-bottom: 5pt;
}
.section ul {
  margin: 0;
  padding-left: 18pt;
}
.section li {
  margin: 5pt 0;
  font-size: 11pt;
  color: #546E7A;
}
</style>
</head>
<body>
<div class="content">
  <div class="header">
    <h2>第4集：陈化的等待</h2>
  </div>
  <div class="section">
    <h3>核心事件</h3>
    <ul>
      <li>阿三可以独立做茶</li>
      <li>学习陈化管理</li>
      <li>陈化至少半年，一年最好</li>
      <li>茶叶陈化半年后出库</li>
    </ul>
  </div>
  <div class="section">
    <h3>陈化的哲理</h3>
    <ul>
      <li>"六堡茶的魅力，就在陈化"</li>
      <li>"红、浓、陈、醇，这四绝，陈化占了一半"</li>
      <li>"陈化需要时间，急不得。你得学会等待"</li>
    </ul>
  </div>
  <div class="section">
    <h3>名场面</h3>
    <ul>
      <li>刘师傅："你这一年，成长了很多。从什么都学不会，到现在可以独立做茶，不容易"</li>
      <li>王胖子："阿三，我支持你"</li>
      <li>旁白："学会了等待"</li>
    </ul>
  </div>
</div>
</body>
</html>
