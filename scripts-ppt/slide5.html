<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f8f9fa;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.content {
  padding: 35pt;
  flex: 1;
  overflow-y: auto;
}
.header {
  background: #5D4E37;
  padding: 10pt 25pt;
  border-radius: 8pt;
  margin-bottom: 15pt;
}
.header h2 {
  margin: 0;
  color: #ffffff;
  font-size: 22pt;
}
.episode {
  background: #ffffff;
  border-radius: 8pt;
  padding: 15pt;
  margin-bottom: 10pt;
  border-left: 5pt solid #2C3E50;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
.episode h3 {
  margin: 0 0 8pt 0;
  color: #2C3E50;
  font-size: 16pt;
}
.episode p {
  margin: 4pt 0;
  font-size: 12pt;
  color: #546E7A;
}
.episode strong {
  color: #5D4E37;
}
</style>
</head>
<body>
<div class="content">
  <div class="header">
    <h2>剧集目录（续）</h2>
  </div>
  <div class="episode">
    <h3>第6集：风波来了</h3>
    <p><strong>对应章节：</strong>第6章 | <strong>时长：</strong>5分钟 | <strong>核心：</strong>茶厂改制、王胖子跳槽</p>
  </div>
  <div class="episode">
    <h3>第7集：出走的决定</h3>
    <p><strong>对应章节：</strong>第7章 | <strong>时长：</strong>5分钟 | <strong>核心：</strong>阿三外出闯荡、离开茶厂</p>
  </div>
  <div class="episode">
    <h3>第8集：外面的世界</h3>
    <p><strong>对应章节：</strong>第8章 | <strong>时长：</strong>5分钟 | <strong>核心：</strong>广州茶叶市场乱象、假茶</p>
  </div>
  <div class="episode">
    <h3>第9集：归来的决定</h3>
    <p><strong>对应章节：</strong>第9章 | <strong>时长：</strong>5分钟 | <strong>核心：</strong>决定回到横县、回到茶厂</p>
  </div>
  <div class="episode">
    <h3>第10集：传承的开始</h3>
    <p><strong>对应章节：</strong>第10章 | <strong>时长：</strong>5分钟 | <strong>核心：</strong>师父退休、阿三接班</p>
  </div>
</div>
</body>
</html>
