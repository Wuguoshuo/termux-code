<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f8f9fa;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.content {
  padding: 35pt;
  flex: 1;
  overflow-y: auto;
}
.header {
  background: #5D4E37;
  padding: 10pt 25pt;
  border-radius: 8pt;
  margin-bottom: 15pt;
}
.header h2 {
  margin: 0;
  color: #ffffff;
  font-size: 22pt;
}
.episode {
  background: #ffffff;
  border-radius: 8pt;
  padding: 15pt;
  margin-bottom: 10pt;
  border-left: 5pt solid #2C3E50;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
.episode h3 {
  margin: 0 0 8pt 0;
  color: #2C3E50;
  font-size: 16pt;
}
.episode p {
  margin: 4pt 0;
  font-size: 12pt;
  color: #546E7A;
}
.episode strong {
  color: #5D4E37;
}
</style>
</head>
<body>
<div class="content">
  <div class="header">
    <h2>剧集目录</h2>
  </div>
  <div class="episode">
    <h3>第1集：命运的安排</h3>
    <p><strong>对应章节：</strong>第1章 | <strong>时长：</strong>5分钟 | <strong>核心：</strong>进厂、遇师父、炒糊茶叶</p>
  </div>
  <div class="episode">
    <h3>第2集：学艺的日子</h3>
    <p><strong>对应章节：</strong>第2章 | <strong>时长：</strong>5分钟 | <strong>核心：</strong>学习杀青、揉捻、债务免除</p>
  </div>
  <div class="episode">
    <h3>第3集：渥堆初体验</h3>
    <p><strong>对应章节：</strong>第3章 | <strong>时长：</strong>5分钟 | <strong>核心：</strong>学习渥堆（六堡茶核心工艺）</p>
  </div>
  <div class="episode">
    <h3>第4集：陈化的等待</h3>
    <p><strong>对应章节：</strong>第4章 | <strong>时长：</strong>5分钟 | <strong>核心：</strong>学习陈化管理、独立做茶</p>
  </div>
  <div class="episode">
    <h3>第5集：分歧的开始</h3>
    <p><strong>对应章节：</strong>第5章 | <strong>时长：</strong>5分钟 | <strong>核心：</strong>现代化设备 vs 传统工艺</p>
  </div>
</div>
</body>
</html>
