<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f8f9fa;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.content {
  padding: 30pt;
  flex: 1;
  overflow-y: auto;
}
.header {
  background: linear-gradient(90deg, #8E44AD 0%, #A93226 100%);
  padding: 12pt 25pt;
  border-radius: 8pt;
  margin-bottom: 15pt;
}
.header h2 {
  margin: 0;
  color: #ffffff;
  font-size: 24pt;
}
.section {
  background: #ffffff;
  border-radius: 8pt;
  padding: 15pt;
  margin-bottom: 12pt;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
.section h3 {
  margin: 0 0 10pt 0;
  color: #8E44AD;
  font-size: 15pt;
  border-bottom: 2pt solid #8E44AD;
  padding-bottom: 5pt;
}
.section ul {
  margin: 0;
  padding-left: 18pt;
}
.section li {
  margin: 5pt 0;
  font-size: 11pt;
  color: #546E7A;
}
</style>
</head>
<body>
<div class="content">
  <div class="header">
    <h2>第7集：出走的决定</h2>
  </div>
  <div class="section">
    <h3>核心事件</h3>
    <ul>
      <li>阿三和胖子决定跳槽</li>
      <li>去广州闯荡</li>
      <li>刘师傅的默许："去吧"</li>
      <li>周经理满意：坚持传统工艺的人走了</li>
    </ul>
  </div>
  <div class="section">
    <h3>主要冲突</h3>
    <ul>
      <li>留茶厂 vs 外出闯荡</li>
      <li>阿三的不舍 vs 胖子的兴奋</li>
      <li>刘师傅的支持 vs 阿三的犹豫</li>
    </ul>
  </div>
  <div class="section">
    <h3>名场面</h3>
    <ul>
      <li>胖子："阿三，你准备好了吗？别想了，走就对了"</li>
      <li>刘师傅："去吧，好好想想。跳槽不跳槽，你自己决定"</li>
      <li>阿三回头看了茶厂最后一眼</li>
      <li>周经理："陈阿三走了，王胖子也走了。这样也好，那些坚持传统工艺的人走了，我们就可以引入现代化设备了"</li>
    </ul>
  </div>
</div>
</body>
</html>
