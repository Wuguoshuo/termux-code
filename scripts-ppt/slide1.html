<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: linear-gradient(135deg, #2C3E50 0%, #5D4E37 100%);
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: relative;
}
body::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/></svg>');
  background-size: 200px;
  background-repeat: no-repeat;
  background-position: center;
}
.title {
  z-index: 1;
  text-align: center;
  color: #ffffff;
  margin: 0 40pt;
}
.title h1 {
  font-size: 48pt;
  font-weight: bold;
  margin: 0 0 20pt 0;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}
.title p {
  font-size: 24pt;
  margin: 10pt 0;
  opacity: 0.9;
}
.info {
  z-index: 1;
  display: flex;
  gap: 30pt;
  margin-top: 40pt;
  text-align: center;
}
.info-item {
  background: rgba(255,255,255,0.15);
  padding: 15pt 25pt;
  border-radius: 8pt;
  backdrop-filter: blur(10px);
}
.info-item p {
  margin: 0;
  font-size: 16pt;
  color: #ffffff;
  font-weight: bold;
}
.info-item span {
  font-size: 12pt;
  opacity: 0.8;
  display: block;
  margin-top: 5pt;
}
</style>
</head>
<body>
<div class="title">
  <h1>六堡风云</h1>
  <p>短剧剧本全集</p>
</div>
<div class="info">
  <div class="info-item">
    <p>10集</p>
    <span>总集数</span>
  </div>
  <div class="info-item">
    <p>50分钟</p>
    <span>总时长</span>
  </div>
  <div class="info-item">
    <p>2025</p>
    <span>创作年份</span>
  </div>
</div>
</body>
</html>
