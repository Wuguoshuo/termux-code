<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f8f9fa;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.content {
  padding: 30pt;
  flex: 1;
  overflow-y: auto;
}
.header {
  background: linear-gradient(90deg, #5D4E37 0%, #8B5A2B 100%);
  padding: 12pt 25pt;
  border-radius: 8pt;
  margin-bottom: 15pt;
}
.header h2 {
  margin: 0;
  color: #ffffff;
  font-size: 24pt;
}
.section {
  background: #ffffff;
  border-radius: 8pt;
  padding: 15pt;
  margin-bottom: 12pt;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
.section h3 {
  margin: 0 0 10pt 0;
  color: #2C3E50;
  font-size: 15pt;
  border-bottom: 2pt solid #5D4E37;
  padding-bottom: 5pt;
}
.section ul {
  margin: 0;
  padding-left: 18pt;
}
.section li {
  margin: 5pt 0;
  font-size: 11pt;
  color: #546E7A;
}
.highlight {
  background: #fff3cd;
  padding: 12pt;
  border-radius: 6pt;
  border-left: 4pt solid #ffc107;
  margin-bottom: 10pt;
}
.highlight h3 {
  margin: 0 0 8pt 0;
  color: #856404;
  font-size: 14pt;
}
.highlight p {
  margin: 0;
  font-size: 11pt;
  color: #856404;
}
.highlight strong {
  color: #d39e00;
}
</style>
</head>
<body>
<div class="content">
  <div class="header">
    <h2>第1集：命运的安排</h2>
  </div>
  <div class="highlight">
    <h3>金句台词</h3>
    <p><strong>"会欠钱。"</strong> - 陈阿三（全剧首句金句）</p>
  </div>
  <div class="section">
    <h3>人物</h3>
    <ul>
      <li>陈阿三：18岁，茶厂学徒</li>
      <li>刘师傅：50多岁，制茶师傅</li>
      <li>王胖子：18岁，学徒</li>
      <li>眼镜叔：40多岁，厂里办事员</li>
    </ul>
  </div>
  <div class="section">
    <h3>核心事件</h3>
    <ul>
      <li>1992年夏天，陈阿三进横县茶厂</li>
      <li>分给刘师傅当学徒（阿三父亲是刘师傅师兄弟）</li>
      <li>炒糊茶叶名场面</li>
      <li>刘师傅给洗洁精（刀子嘴豆腐心）</li>
    </ul>
  </div>
  <div class="section">
    <h3>主要冲突</h3>
    <ul>
      <li>师徒冲突：阿三笨拙 vs 刘师傅严厉</li>
      <li>悬念：刘师傅和阿三的父亲是师兄弟</li>
    </ul>
  </div>
</div>
</body>
</html>
