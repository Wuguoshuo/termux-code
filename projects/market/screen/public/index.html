<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1">
  <title>六堡茶价格监测中心 - 数据大屏</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a1a; color: #fff; font-family: 'Microsoft YaHei', sans-serif; overflow: hidden; }
    .screen { width: 100vw; height: 100vh; padding: 20px; display: flex; flex-direction: column; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header h1 { font-size: 32px; font-weight: bold; background: linear-gradient(90deg, #1890ff, #00ffff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header .time { font-size: 24px; color: #00ffff; }
    .content { flex: 1; display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 20px; }
    .panel { background: rgba(20, 30, 60, 0.8); border: 1px solid rgba(0, 255, 255, 0.2); border-radius: 10px; padding: 20px; }
    .panel-title { font-size: 18px; color: #00ffff; margin-bottom: 15px; border-bottom: 1px solid rgba(0, 255, 255, 0.3); padding-bottom: 10px; }
    .stat-card { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(0, 50, 100, 0.3); border-radius: 8px; margin-bottom: 10px; }
    .stat-card .label { color: #aaa; font-size: 14px; }
    .stat-card .value { font-size: 28px; font-weight: bold; }
    .stat-card .value.up { color: #ff4d4f; }
    .stat-card .value.down { color: #52c41a; }
    .ranking-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .ranking-item .rank { width: 30px; height: 30px; background: #1890ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .ranking-item .name { flex: 1; margin-left: 10px; font-size: 14px; }
    .ranking-item .change { font-size: 16px; font-weight: bold; }
    .scroll-list { max-height: 200px; overflow: hidden; }
    .scroll-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
    .chart-container { height: 200px; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="header">
      <h1>🏭 广西六堡茶大宗交易市场 - 实时价格监测中心</h1>
      <div class="time" id="currentTime"></div>
    </div>
    <div class="content">
      <div class="panel">
        <div class="panel-title">📊 价格指数</div>
        <div class="stat-card">
          <span class="label">价格指数</span>
          <span class="value" id="priceIndex">128.56</span>
        </div>
        <div class="stat-card">
          <span class="label">涨跌幅度</span>
          <span class="value up" id="priceChange">+3.45%</span>
        </div>
        <div class="panel-title">📈 涨跌分布</div>
        <div id="pieChart" class="chart-container"></div>
        <div class="panel-title">🍵 品类均价</div>
        <div id="categoryChart" class="chart-container"></div>
      </div>
      <div class="panel">
        <div class="panel-title">🚀 涨幅榜 TOP10</div>
        <div id="risingChart" style="height: 200px;"></div>
        <div class="panel-title">📦 实时价格滚动</div>
        <div class="scroll-list" id="scrollList"></div>
        <div class="panel-title">📉 跌幅榜 TOP10</div>
        <div id="fallingChart" style="height: 200px;"></div>
      </div>
      <div class="panel">
        <div class="panel-title">💰 交易统计</div>
        <div class="stat-card">
          <span class="label">总成交额</span>
          <span class="value" id="totalTurnover">2,850.6万</span>
        </div>
        <div class="stat-card">
          <span class="label">总成交量</span>
          <span class="value" id="totalVolume">18.5万kg</span>
        </div>
        <div class="stat-card">
          <span class="label">报价品种</span>
          <span class="value" id="totalProducts">156</span>
        </div>
        <div class="panel-title">🏆 成交额排行</div>
        <div id="volumeChart" class="chart-container"></div>
      </div>
    </div>
  </div>
  <script src="screen.js"></script>
</body>
</html>
